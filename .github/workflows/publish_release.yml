name: CD/Release
run-name: |
  Publish release - ${{ github.event.inputs.bump_type }}
  ${{ startsWith(github.event.inputs.bump_type, 'pre') && github.event.inputs.preid || '' }}

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump types"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - premajor
          - minor
          - preminor
          - patch
          - prepatch
          - prerelease
      preid:
        description: "Prerelease identifier"
        type: string

jobs:
  prepare-release:
    name: Update Changelog and citation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.query-release-info.outputs.version }}
      release_notes: ${{ steps.query-release-info.outputs.release-notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump changelog version
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ github.event.inputs.bump_type }}
          preid: ${{ github.event.inputs.preid }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: Get version
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest

      - name: Bump pyproject.toml version
        run: |
          VERSION=${{ steps.query-release-info.outputs.version }}

          if [ -f pyproject.toml ]; then
            sed -i "s/^default-version = .*/default-version = \"$VERSION\"/" pyproject.toml
          else
            echo "pyproject.toml not found!" && exit 1
          fi

      - name: Bump CITATION.cff version
        run: |
          VERSION=${{ steps.query-release-info.outputs.version }}
          DATE=$(date -u +%Y-%m-%d)

          if [ -f CITATION.cff ]; then
            sed -i "s/^version: .*/version: $VERSION/" CITATION.cff
            sed -i "s/^date-released: .*/date-released: '$DATE'/" CITATION.cff
          else
            echo "CITATION.cff not found, skipping update."
          fi

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Release v${{ steps.query-release-info.outputs.version }}"

      - name: Create Commit Patch
        run: |
          git format-patch -1 HEAD --stdout > release-commit.patch

      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: release-commit.patch

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git am release-commit.patch
          rm release-commit.patch
          git tag -f "v${{ needs.prepare-release.outputs.version }}" HEAD

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install build tool
        run: python -m pip install build

      - name: Build Source Distribution (sdist)
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-aster:
    uses: ./.github/workflows/build_aster.yml

  build-fasttree:
    uses: ./.github/workflows/build_fasttree.yml

  build-iqtree:
    uses: ./.github/workflows/build_iqtree.yml

  test-sdist:
    name: Test sdist
    runs-on: ubuntu-latest
    needs: [build-sdist, build-aster, build-fasttree, build-iqtree]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Download ASTER binary
        uses: actions/download-artifact@v7
        with:
          name: aster-binary-payload
          path: bin

      - name: Download FastTree binary
        uses: actions/download-artifact@v7
        with:
          name: fasttree-binary-payload
          path: bin

      - name: Download IQTree binary
        uses: actions/download-artifact@v7
        with:
          name: iqtree-binary-payload
          path: bin

      - name: Setup binary environment execution paths
        run: |
          chmod +x bin/*
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Verify binaries are active in PATH
        run: |
          which astral
          which FastTree
          which iqtree3

      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install pip and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Install from sdist
        run: |
          python -m pip install dist/*.tar.gz

      - name: Test with pytest
        run: |
          pytest -vv tests

  conda-build-and-test:
    uses: ./.github/workflows/conda_build_and_test.yml

  publish-release:
    name: Publish Release Asset - v${{ needs.prepare-release.outputs.version }}
    environment: GitHub releases
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-sdist
      - test-sdist
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git am release-commit.patch
          rm release-commit.patch
          git tag -f "v${{ needs.prepare-release.outputs.version }}" HEAD

      - name: Push the updated commits
        run: |
          git push --follow-tags

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.prepare-release.outputs.release_notes }}
          tag_name: v${{ needs.prepare-release.outputs.version }}
          prerelease: ${{ github.event.inputs.bump_type == 'prerelease' }}
          make_latest: ${{ github.event.inputs.bump_type != 'prerelease' }}
          files: dist/*.tar.gz

  build-container:
    name: Build and publish container image
    needs:
      - prepare-release
      - publish-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      ref: v${{ needs.prepare-release.outputs.version }}
      push: true
      latest: ${{ github.event.inputs.bump_type != 'prerelease' }}
