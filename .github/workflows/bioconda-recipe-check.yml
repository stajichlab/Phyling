# Weekly check that bioconda/meta.yaml is identical to the live recipe in bioconda/bioconda-recipes
# (recipes/phyling/meta.yaml). If they differ, opens an issue with the diff (or updates the open one) and closes it
# once they match again. It only reports: update the bioconda-recipes PR or bioconda/meta.yaml by hand.

name: Bioconda recipe check

on:
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: stajichlab/gh_workflows/.github/workflows/bioconda_recipe_check.yml@v2
    permissions:
      contents: read
      issues: write
    with:
      recipe_path: bioconda/meta.yaml
