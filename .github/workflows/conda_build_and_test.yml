name: CI/Conda build and test

on:
  push:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml", "dev_environment.yml"]
  pull_request:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml", "dev_environment.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  conda-build-and-test:
    name: Conda build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full commit history without old file contents (treeless clone), so versioningit can find the last tag
          # while the download stays small as history grows
          fetch-depth: 0
          filter: tree:0

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: dev_environment.yml
          create-args: >-
            python=3.13
            --repodata-ttl 0
          cache-environment: false
          cache-downloads: false

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      # Already installed in dev_environment.yml
      # - name: Install package
      #   run: pip install .
      #   shell: micromamba-shell {0}

      - name: Pytest
        run: pytest -vv
        shell: micromamba-shell {0}
