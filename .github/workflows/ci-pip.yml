name: CI/pip

on:
  push:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml", ".github/workflows/ci-pip.yml", ".github/workflows/build-tools.yml"]
  pull_request:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml", ".github/workflows/ci-pip.yml", ".github/workflows/build-tools.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3

  build-tools:
    uses: ./.github/workflows/build-tools.yml

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build-tools
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full commit history without old file contents (treeless clone), so versioningit can find the last tag
          # while the download stays small as history grows
          fetch-depth: 0
          filter: tree:0

      - name: Download external tools
        uses: actions/download-artifact@v8
        with:
          pattern: tool-*
          merge-multiple: true
          path: ${{ runner.temp }}/bin

      - name: Add external tools to PATH
        run: |
          chmod +x "$RUNNER_TEMP"/bin/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          flags: python-${{ matrix.python }}
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
