name: Publish

# Runs when a release/v<version> pull request is merged into main: build the sdist and test it with pip, tag and
# publish the GitHub release with the sdist attached, then build and push the container image and merge main into dev.

on:
  pull_request:
    types: [closed]
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-sdist:
    name: Build sdist
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full commit history without old file contents (treeless clone), so versioningit can find the last tag
          # while the download stays small as history grows
          fetch-depth: 0
          filter: tree:0

      # The release tag does not exist yet; tag locally so versioningit gives the release version
      - name: Tag release commit locally
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git tag "${HEAD_REF#release/}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-tools:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    uses: ./.github/workflows/build-tools.yml

  test-sdist:
    name: Test sdist (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [build-sdist, build-tools]
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pyproject.toml

      - name: Download external tools
        uses: actions/download-artifact@v8
        with:
          pattern: tool-*
          merge-multiple: true
          path: ${{ runner.temp }}/bin

      - name: Add external tools to PATH
        run: |
          chmod +x "$RUNNER_TEMP"/bin/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install from sdist
        run: python -m pip install pytest dist/*.tar.gz

      - name: Test with pytest
        run: pytest tests

  publish:
    needs: test-sdist
    uses: stajichlab/gh_workflows/.github/workflows/release_publish.yml@v1
    permissions:
      contents: write
    with:
      artifact: sdist
      environment: GitHub releases

  container:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: stajichlab/gh_workflows/.github/workflows/container_build.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.publish.outputs.tag }}
      latest: true   # ignored for prereleases
      smoke_test_args: --help

  sync-dev:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: stajichlab/gh_workflows/.github/workflows/sync_dev.yml@v1
    permissions:
      contents: write
      pull-requests: write
