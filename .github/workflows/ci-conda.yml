name: CI/conda

on:
  push:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml", "dev_environment.yml", ".github/workflows/ci-conda.yml"]
  pull_request:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml", "dev_environment.yml", ".github/workflows/ci-conda.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (conda)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full commit history without old file contents (treeless clone), so versioningit can find the last tag
          # while the download stays small as history grows
          fetch-depth: 0
          filter: tree:0

      # dev_environment.yml provides the external tools from bioconda and installs Phyling in editable mode
      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: dev_environment.yml
          cache-downloads: true

      - name: Test with pytest
        run: pytest
        shell: micromamba-shell {0}
