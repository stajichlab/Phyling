name: Release
run-name: |
  Release - ${{ inputs.bump_type }}${{ startsWith(inputs.bump_type, 'pre') && inputs.preid && format(' ({0})', inputs.preid) || '' }}

# Manually triggered: bump the version, changelog and citation, then open a release/v<version> pull request. Merging
# it runs publish.yml.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - premajor
          - minor
          - preminor
          - patch
          - prepatch
          - prerelease
      preid:
        description: "Prerelease identifier"
        type: string

jobs:
  prepare:
    uses: stajichlab/gh_workflows/.github/workflows/release_prepare.yml@v2
    permissions:
      contents: write
      pull-requests: write
    with:
      bump_type: ${{ inputs.bump_type }}
      preid: ${{ inputs.preid }}
      additional_bump_command: |
        sed -i "s/^default-version = .*/default-version = \"$VERSION\"/" pyproject.toml
        grep -q "^default-version = \"$VERSION\"" pyproject.toml
        # Stable releases only (a prerelease $VERSION contains "-"): set the bioconda recipe's version and reset its
        # build number. Its sha256 is set by publish.yml once the release sdist exists.
        case "$VERSION" in
          *-*) echo "Prerelease $VERSION: bioconda/meta.yaml left unchanged" ;;
          *)
            sed -i -E -e "s/^(\{% set version = \")[^\"]*(\" %\})/\1${VERSION}\2/" -e "s/^(  number: )[0-9]+/\10/" bioconda/meta.yaml
            grep -q "set version = \"${VERSION}\"" bioconda/meta.yaml
            ;;
        esac
