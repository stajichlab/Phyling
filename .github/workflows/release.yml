name: Release
run-name: |
  Release - ${{ inputs.bump_type }}${{ startsWith(inputs.bump_type, 'pre') && inputs.preid && format(' ({0})', inputs.preid) || '' }}

# Manually triggered: bump the version from the changelog, build and test the sdist with pip, publish the GitHub
# release, then build and push the container image.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - premajor
          - minor
          - preminor
          - patch
          - prepatch
          - prerelease
      preid:
        description: "Prerelease identifier"
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Update changelog and citation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.query.outputs.version }}
      release_notes: ${{ steps.query.outputs.release-notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bump changelog version
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ inputs.bump_type }}
          preid: ${{ inputs.preid }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: Get version
        id: query
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest

      - name: Bump fallback version and citation
        env:
          VERSION: ${{ steps.query.outputs.version }}
        run: |
          sed -i "s/^default-version = .*/default-version = \"$VERSION\"/" pyproject.toml
          grep -q "^default-version = \"$VERSION\"" pyproject.toml
          if [ -f CITATION.cff ]; then
            sed -i "s/^version: .*/version: $VERSION/" CITATION.cff
            sed -i "s/^date-released: .*/date-released: '$(date -u +%Y-%m-%d)'/" CITATION.cff
          fi

      - name: Commit and export release patch
        env:
          VERSION: ${{ steps.query.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${VERSION}"
          git format-patch -1 HEAD --stdout > release-commit.patch

      - uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: release-commit.patch

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full commit history without old file contents (treeless clone), so versioningit can find the last tag
          # while the download stays small as history grows
          fetch-depth: 0
          filter: tree:0

      - uses: actions/download-artifact@v8
        with:
          name: release-patch

      - name: Apply release commit and tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am release-commit.patch
          rm release-commit.patch
          git tag "v${VERSION}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-tools:
    uses: ./.github/workflows/build-tools.yml

  test-sdist:
    name: Test sdist (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [build-sdist, build-tools]
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pyproject.toml

      - name: Download external tools
        uses: actions/download-artifact@v8
        with:
          pattern: tool-*
          merge-multiple: true
          path: ${{ runner.temp }}/bin

      - name: Add external tools to PATH
        run: |
          chmod +x "$RUNNER_TEMP"/bin/*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install from sdist
        run: python -m pip install pytest dist/*.tar.gz

      - name: Test with pytest
        run: pytest tests

  publish:
    name: Publish v${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    environment: GitHub releases
    needs: [prepare, test-sdist]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-patch

      - name: Apply release commit, tag and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am release-commit.patch
          rm release-commit.patch
          git tag "v${VERSION}"
          git push --atomic origin HEAD "v${VERSION}"

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.prepare.outputs.release_notes }}
          tag_name: v${{ needs.prepare.outputs.version }}
          prerelease: ${{ startsWith(inputs.bump_type, 'pre') }}
          make_latest: ${{ !startsWith(inputs.bump_type, 'pre') }}
          files: dist/*.tar.gz

  container:
    name: Build and push container image
    needs: [prepare, publish]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      ref: v${{ needs.prepare.outputs.version }}
      push: true
      latest: ${{ !startsWith(inputs.bump_type, 'pre') }}
