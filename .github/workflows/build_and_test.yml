name: CI/Build and test [dev]

on:
  push:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml"]
  pull_request:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml"]
  workflow_dispatch:

jobs:
  build-aster:
    uses: ./.github/workflows/build_aster.yml

  build-fasttree:
    uses: ./.github/workflows/build_fasttree.yml

  build-iqtree:
    uses: ./.github/workflows/build_iqtree.yml

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      OS: Linux
    needs: [build-aster, build-fasttree, build-iqtree]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Download ASTER binary
        uses: actions/download-artifact@v7
        with:
          name: aster-binary-payload
          path: bin

      - name: Download FastTree binary
        uses: actions/download-artifact@v7
        with:
          name: fasttree-binary-payload
          path: bin

      - name: Download IQTree binary
        uses: actions/download-artifact@v7
        with:
          name: iqtree-binary-payload
          path: bin

      - name: Setup binary environment execution paths
        run: |
          chmod +x bin/*
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Verify binaries are active in PATH
        run: |
          which astral
          which FastTree
          which iqtree3

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -e .

      - name: Test with pytest
        run: |
          pytest -vv --cov --cov-report=xml

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python }}
          path: coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          flags: ${{ matrix.python }}
          env_vars: OS
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
