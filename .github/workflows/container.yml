name: CD/Container

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: "Tag to build the image from (e.g. v1.2.3)"
        type: string
        required: true
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: true
      latest:
        description: "Also tag this image as latest"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (e.g. testing). Leave blank to just build."
        type: string
        default: ""
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: false

concurrency:
  group: container-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stajichlab/phyling

jobs:
  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Compute version tags ourselves rather than relying on metadata-action's
      # ref auto-detection: for a workflow_call, github.ref is the *caller's*
      # ref (e.g. the branch that ran release.yml), not the tag we were asked
      # to build. github.event_name is also the caller's event, so a call is
      # detected by the ref input, which only workflow_call provides.
      - name: Resolve ref and push decision
        id: resolve
        env:
          CALL_REF: ${{ inputs.ref }}
          INPUT_PUSH: ${{ inputs.push }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ -n "$CALL_REF" ]; then
            MODE=call
            REF_NAME="$CALL_REF"
            PUSH="$INPUT_PUSH"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE=dispatch
            REF_NAME="$GITHUB_REF_VALUE"
            PUSH="$INPUT_PUSH"
          else
            MODE=event
            REF_NAME="$GITHUB_REF_VALUE"
            PUSH="true"
          fi
          REF_NAME="${REF_NAME#refs/tags/}"
          REF_NAME="${REF_NAME#refs/heads/}"

          VERSION=""
          MAJOR_MINOR=""
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${REF_NAME#v}"
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          fi

          {
            echo "mode=$MODE"
            echo "ref=$REF_NAME"
            echo "push=$PUSH"
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.ref || github.ref }}
          # Full history and tags: the Docker build runs versioningit offline, so a treeless clone is not enough
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.resolve.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.version }},enable=${{ steps.resolve.outputs.version != '' }}
            type=raw,value=${{ steps.resolve.outputs.major_minor }},enable=${{ steps.resolve.outputs.major_minor != '' }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && github.event.release.prerelease == false) || (steps.resolve.outputs.mode == 'call' && inputs.latest) }}
            type=raw,value=${{ inputs.tag }},enable=${{ steps.resolve.outputs.mode == 'dispatch' && inputs.tag != '' }}
            type=sha,format=short,prefix=sha-,enable=${{ steps.resolve.outputs.mode == 'dispatch' && inputs.tag == '' }}

      # Build once and load it locally so the smoke test runs against the
      # exact image before it is ever pushed to the registry.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm ${{ fromJson(steps.meta.outputs.json).tags[0] }} --help

      - name: Push image
        if: steps.resolve.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
