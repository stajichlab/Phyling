name: CD/Container

# Manually build a container image from the selected branch or tag. Release images are built by publish.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (e.g. testing). Leave blank for just sha-<commit>."
        type: string
        default: ""
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: false

jobs:
  container:
    uses: stajichlab/gh_workflows/.github/workflows/container_build.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.ref_name }}
      extra_tags: ${{ inputs.tag }}
      push: ${{ inputs.push }}
      smoke_test_args: --help
