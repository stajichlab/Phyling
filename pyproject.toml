[build-system]
requires = ["hatchling>=1.27", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "phyling"
authors = [
  { name = "Jason Stajich", email = "jasonstajich.phd@gmail.com" },
  { name = "Cheng-Hung Tsai", email = "chenghung.tsai@email.ucr.edu" },
]
maintainers = [
  { name = "Jason Stajich", email = "jasonstajich.phd@gmail.com" },
  { name = "Cheng-Hung Tsai", email = "chenghung.tsai@email.ucr.edu" },
]
license = "MIT"
license-files = ["LICENSE"]
description = "A lightweight phylogenetic tree builder from annotated genomes."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "biopython>=1.81",
  "clipkit>=2.1.1",
  "matplotlib>=3.5.3",
  "numpy>=2.0.2,<3.0.0",
  "phykit>=2.8.0",
  "pyfaidx>=0.9.0.3",
  "pyhmmer>=0.12.0",
  "typing-extensions; python_version < '3.11'",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=5.0.0",
]
docs = [
  "sphinx>=7.0",
  "myst-parser>=3.0",
  "furo>=2024.1.29",
  "sphinx-copybutton>=0.5.2",
  "sphinx-autobuild>=2024.10.3",
]

[project.scripts]
phyling = "phyling.main:run_cli"

[project.urls]
"Homepage" = "https://github.com/stajichlab/Phyling"
"Documentation" = "https://phyling.readthedocs.io"
"Bug Tracker" = "https://github.com/stajichlab/Phyling/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/src/phyling",
  "/pyproject.toml",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
]

[tool.hatch.version]
source = "versioningit"

[tool.hatch.build.targets.wheel]
packages = ["src/phyling"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -vv"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
  "**/__init__.py",
  "**/_[^_]*.py",
  "tests/*.py",
  "**/exception.py",
  "*.egg-info/**",
]

[tool.coverage.report]
exclude_also = [
  "def _\\w+\\(",
  "async def _\\w+\\(",
]

[tool.versioningit]
default-version = "2.4.1"

[tool.versioningit.vcs]
method = "git"
default-tag = "0.0.0"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E701"]

[tool.ruff.lint.per-file-ignores]
# Warning filters must be installed before importing numpy-dependent modules
"src/phyling/external/_iqtree.py" = ["E402"]
"src/phyling/external/_libphykit.py" = ["E402"]
"src/phyling/external/_models.py" = ["E402"]
# PHYLING_DB must be set before phyling is imported
"tests/conftest.py" = ["E402"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.15"

[tool.pixi.feature.prod.pypi-dependencies]
phyling = { path = ".", editable = false }

[tool.pixi.feature.dev.pypi-dependencies]
phyling = { path = ".", editable = true, extras = ["dev", "docs"] }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
graphviz = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest"
docs = "sphinx-build -b html docs docs/_build/html"
docs-serve = "sphinx-autobuild docs docs/_build/html"

[tool.pixi.environments]
default = { features = ["prod"] }
dev = { features = ["dev"] }
